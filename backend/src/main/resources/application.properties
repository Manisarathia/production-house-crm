spring.application.name=production-house-crm
server.port=8080

# Database configurations 
spring.datasource.url=jdbc:mysql://localhost:3306/production_house_crm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate (creates tables automatically) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# frontend sends "" for blank date fields
spring.jackson.deserialization.accept-empty-string-as-null-object=true
crm.auth.jwt-secret=${CRM_AUTH_JWT_SECRET:production-house-crm-jwt-secret-key-must-have-32-bytes!}
crm.settings.encryption-key=${CRM_SETTINGS_ENCRYPTION_KEY:production-house-crm-encryption-secret-key-32b!}
crm.web.allowed-origins=*

