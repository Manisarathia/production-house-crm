spring.application.name=production-house-crm

server.port=8080

# Database configurations 
spring.datasource.jdbc-url=jdbc:mysql://localhost:3306/production_house_crm?createDatabaseIfNotExist=true
spring.datasource.url=${spring.datasource.jdbc-url}
spring.datasource.username=root
spring.datasource.password=Loop@0987
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
crm.auth.jwt-secret=${CRM_AUTH_JWT_SECRET:}
crm.settings.encryption-key=${CRM_SETTINGS_ENCRYPTION_KEY:}